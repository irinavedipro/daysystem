      if (val == null) return '';
      if (typeof val === 'string' || typeof val === 'number') return val;
      if (Array.isArray(val)) return val.map(v => typeof v === 'object' ? JSON.stringify(v) : v).join(', ');

      return String(val);
    };

        date: `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`,

    };

      const userRequestText = `
        КОНТЕКСТ ПРОЕКТА:
        ${contextText}

        ИСТОРИЯ ИЗМЕНЕНИЙ:
        ${historyText}

        НОВЫЙ ЗАПРОС: «${userPrompt}».
        Текущий план: ${JSON.stringify(currentData)}.
        Пересобери план.
      `;

      const payload = {
        contents: [{ parts: [{ text: userRequestText }] }],
        systemInstruction: { parts: [{ text: systemInstructionText }] },
        generationConfig: { responseMimeType: "application/json", responseSchema: planSchema }
      };

      for (let i = 0; i < 5; i++) {
        try {
          const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
          if (response.ok === false) throw new Error(`HTTP error! status: ${response.status}`);
          const result = await response.json();
          const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) return JSON.parse(text);
        } catch (e) {
          if (i === 4) throw e;
          await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
        }
      }
    };

    function App() {

            <div className="flex items-center justify-between w-full max-w-sm mt-3 bg-white/10 rounded-sm p-1">
              <button

                title="Предыдущий день"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" /></svg>

            )}

            {/* --- ЭКРАН 4: ИСТОРИЯ --- */}
            {activeTab === 'history' && (
              <div className="animate-in fade-in slide-in-from-bottom-2 duration-300 flex flex-col gap-4">
                <div className="bg-[#FFF8D6] border border-[#E8D9A8] text-[#8C7B3E] p-4 text-sm font-medium rounded-sm">
                  <span className="font-bold uppercase tracking-wide">📜 Журнал трансформаций</span>
                  <p className="mt-1">Здесь видны паттерны твоих решений и корректировок.</p>
                </div>

                <div className="flex flex-col gap-4 relative">
                  <div className="absolute left-4 top-2 bottom-2 w-0.5 bg-gray-200 z-0"></div>

                  {chatHistory.map((item, index) => (
                    <div key={item.id} className="relative z-10 pl-10">
                      <div className="absolute left-[11px] top-4 w-3 h-3 rounded-full bg-[#5B83A6] ring-4 ring-gray-50"></div>

                      <div className="bg-white border border-gray-200 rounded-sm shadow-sm overflow-hidden">
                        <div className="bg-gray-50 border-b border-gray-200 px-4 py-2 flex justify-between items-center text-xs text-gray-500 font-bold uppercase">
                          <span>Запрос</span>
                          <span>{renderSafe(item.date)}</span>
                        </div>
                        <div className="p-4 text-sm text-gray-800 italic">
                          «{renderSafe(item.request)}»
                        </div>

                        {item.response && item.response.changed && (
                          <div className="border-t border-gray-100 p-4 bg-gray-50/50 flex flex-col gap-2">
                            <div className="flex gap-2 items-start text-sm">
                              <span className="font-bold text-[#3C6D9D] shrink-0 text-xs mt-0.5 uppercase">Действие:</span>
                              <span className="text-gray-700">{renderSafe(item.response.changed)}</span>
                            </div>
                            <div className="flex gap-2 items-start text-sm">
                              <span className="font-bold text-[#CC823F] shrink-0 text-xs mt-0.5 uppercase">Причина:</span>
                              <span className="text-gray-700">{renderSafe(item.response.why)}</span>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
